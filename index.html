<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Clock - Fundamental High School</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container" id="appContainer">
        <div class="header">
            <img src="FHS Logo.png" alt="Fundamental High School Logo" class="logo">
            
            <div class="title-section">
                <b><div id="date" class="date"></div></b>
                <div id="clock" class="time"></div>
                
                <div class="venue-selector-wrap">
                    <select id="venueSelect" class="venue-select" aria-label="Venue Selection">
                        <!-- Options generated dynamically -->
                    </select>
                </div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th colspan="8" class="main-title-header">
                        <select id="assessmentHeaderSelect" class="assessment-header-select" aria-label="Assessment Type">
                            <option value="EXAM INFORMATION">EXAM INFORMATION</option>
                            <option value="CYCLE TEST INFORMATION">CYCLE TEST INFORMATION</option>
                            <option value="INFORMAL TEST INFORMATION">INFORMAL TEST INFORMATION</option>
                            <option value="custom">Custom...</option>
                        </select>
                    </th>
                </tr>

                <tr class="meta-row">
                    <td colspan="8">
                        <div class="meta-control">
                            <span class="meta-label">Phase:</span>
                            <div class="phase-toggle">
                                <button type="button" id="phaseFetBtn" class="phase-btn">FET Phase</button>
                                <button type="button" id="phaseSeniorBtn" class="phase-btn">Senior Phase</button>
                            </div>
                        </div>
                    </td>
                </tr>

                <tr>
                    <th class="col-header-text">Grade</th>
                    <th id="subjectColHeader" class="col-header-text">Subject</th>
                    <th class="col-header-text">Paper</th>
                    <th class="col-header-text">Duration</th>
                    <th class="col-header-text">Reading</th>
                    <th class="col-header-text">Start</th>
                    <th class="col-header-text">Stop</th>
                    <th class="col-header-text">Add</th>
                </tr>
            </thead>
            <tbody id="examRows">
                <!-- Exam rows dynamically rendered via JavaScript -->
            </tbody>
        </table>
    </div>

    <button id="fsBtn" class="fullscreen-btn" type="button">Go Full Screen</button>

</body>
</html>
